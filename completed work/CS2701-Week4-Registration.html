<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Fresh Food For All
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header></header>
        <nav>
            <!-- ToDo: An unordered list to represent the menu, 
                       each list item should correspond to the menu items (Home, Register, Login, Help)
                       The css class of the menu is "navlist"
                       Check lecture slides about lists, an example of a more basic menu, and CSS class selector-->
            <ul class="navlist">
                <li><a href="#">Home</a></li>
                <li><a href="#">Register</a></li>
                <li><a href="#">Login</a></li>
                <li><a href="#">Help</a></li>
            </ul>
         </nav>
        <main>
            <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
            <aside>
                <input type="search" class="search"
                       placeholder="Search"
                       aria-label="Search">
            </aside>
            <section>
                <form class="center" novalidate>
                    
                    <h2>Register</h2>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" class="textInput">
                    <br><br>
                    <label for="email">Email:</label><br>
                    <input type="text" id="email" name="email" class="textInput">
                    <br><br>
                    
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" class="textInput">
                    <br><br>

                    <label for="password">Re-type Password:</label><br>
                    <input type="password" id="password" name="password" class="textInput">
                    <br><br>

                    <input type="checkbox" id="buyer" name="buyer" value="buyer">
                    <label for="buyer">I want to buy produce directly from allotment owners.</label><br>
                    <input type="checkbox" id="seller" name="seller" value="seller">
                    <label for="seller">I want to sell produce from my allotment.</label><br><br>
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">I agree to the Terms of Service.</label>
                    <br><br>

                    <button type="button" onclick="document.getElementById('hiddenParagraph').textContent='Registration successful'">
                        Register
                    </button>

                    <a href="#" onclick="document.getElementById('hiddenParagraph').textContent='Learn more about Fresh Food For All.'; return false;">Learn more</a>

                    <br><br>
                     
                </form>
                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
